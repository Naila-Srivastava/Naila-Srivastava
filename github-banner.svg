<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #0d1117; }
  .panel { fill: #161b22; }
  .label { font-family: monospace; font-size: 10px; fill: #8b949e; }
  .coord { font-family: monospace; font-size: 9px; fill: #58a6ff; }
  .name { font-family: monospace; font-size: 11px; fill: #e6edf3; font-weight: 600; letter-spacing: 2px; }
  .sub { font-family: monospace; font-size: 9px; fill: #8b949e; letter-spacing: 1px; }
  .watermark { font-family: monospace; font-size: 8px; fill: #30363d; letter-spacing: 1px; }

  @keyframes scrollReads  { 0% { transform: translateX(0px); } 100% { transform: translateX(-80px); } }
  @keyframes scrollReads2 { 0% { transform: translateX(0px); } 100% { transform: translateX(-60px); } }
  @keyframes scrollReads3 { 0% { transform: translateX(0px); } 100% { transform: translateX(-100px); } }
  @keyframes scrollReads4 { 0% { transform: translateX(0px); } 100% { transform: translateX(-70px); } }
  @keyframes scrollReads5 { 0% { transform: translateX(0px); } 100% { transform: translateX(-90px); } }
  @keyframes pulseFade  { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  @keyframes pulseFade2 { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes scanCursor { 0% { transform: translateX(80px); opacity: 1; } 90% { transform: translateX(580px); opacity: 1; } 91% { opacity: 0; } 99% { transform: translateX(80px); opacity: 0; } 100% { opacity: 1; } }
  @keyframes snpPulse   { 0%, 100% { opacity: 0.5; stroke-width: 1; } 50% { opacity: 1; stroke-width: 1.5; } }
  @keyframes depthWave  { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }
  @keyframes fadeInUp   { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }

  .row1 { animation: scrollReads  3.8s linear infinite; }
  .row2 { animation: scrollReads2 4.5s linear infinite; }
  .row3 { animation: scrollReads3 3.2s linear infinite; }
  .row4 { animation: scrollReads4 5.0s linear infinite; }
  .row5 { animation: scrollReads5 4.1s linear infinite; }
  .cursor-line { animation: scanCursor 3s ease-in-out infinite; }
  .snp-line    { animation: snpPulse 2s ease-in-out infinite; }
  .depth-g     { animation: depthWave 2.5s ease-in-out infinite; }
  .r1g { animation: pulseFade  2.8s ease-in-out infinite; }
  .r2g { animation: pulseFade2 3.1s ease-in-out infinite; }
  .r3g { animation: pulseFade  3.5s ease-in-out infinite 0.4s; }
  .r4g { animation: pulseFade2 2.6s ease-in-out infinite 0.8s; }
  .r5g { animation: pulseFade  3.8s ease-in-out infinite 0.2s; }
  .info { animation: fadeInUp 1s ease-out 0.3s both; }
</style>

